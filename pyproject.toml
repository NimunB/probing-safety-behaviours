# Minimal packaging so `pip install -e .` makes `safety_probes` importable from ANY working
# directory — notebooks in notebooks/, the UI at the root, or a kernel launched from /workspace
# (VSCode's default). Runtime dependencies are pinned in requirements.txt, not duplicated here.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-probes"
version = "0.1.0.dev0"
description = "Linear probes for safety-relevant behaviours — deception & high-stakes detection + steering."
requires-python = ">=3.10"
dependencies = []  # see requirements.txt (pinned to the audited environment)

[tool.setuptools]
packages = ["safety_probes"]
